<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">

</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="bg-dark text-white p-3" style="width:250px; min-height:100vh; position:fixed;">
        <h4 class="mb-4">👑 Admin</h4>

        <ul class="nav flex-column">
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#users">👤 Users</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#batch">📦 Create Batch</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#batchList">📋 Batches</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#history">📜 History</a></li>
        </ul>
    </div>

    <!-- MAIN -->
    <div class="flex-grow-1" style="margin-left:250px;">

        <!-- TOPBAR -->
        <nav class="navbar bg-white shadow-sm px-3">
            <span class="navbar-brand">Admin Panel</span>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </nav>

        <div class="container-fluid p-4">

            <!-- CREATE USER -->
            <div id="users" class="card shadow-sm mb-4">
                <div class="card-header">👤 Create User</div>
                <div class="card-body">

                    <div class="row">
                        <div class="col-md-3">
                        	<label class="form-label">Name</label>
                            <input class="form-control" id="name" placeholder="Name">
                        </div>
                        <div class="col-md-3">
                        	<label class="form-label">Email</label>
                            <input class="form-control" id="email" placeholder="Email">
                        </div>
                        <div class="col-md-3">
                        	<label class="form-label">Password</label>
                            <input class="form-control" id="password" placeholder="Password">
                        </div>
                        <div class="col-md-2">
                        	<label class="form-label">Role</label>
                            <select class="form-select" id="role">
                                <option value="ADMIN">ADMIN</option>
                                <option value="TRAINER">TRAINER</option>
                                <option value="STUDENT">STUDENT</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                        	<label class="form-label"><p> </p></label>
                            <button class="btn btn-primary w-100" onclick="createUser()">Add</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- USERS TABLE -->
            <div class="card shadow-sm mb-4">
                <div class="card-header">📋 Users List</div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- CREATE BATCH -->
            <div id="batch" class="card shadow-sm mb-4">
                <div class="card-header">📦 Create Batch</div>
                <div class="card-body">

                    <div class="row">
                        <div class="col-md-2">
                        	<label class="form-label">Batch Name</label>
                            <input class="form-control" id="batchName" placeholder="Batch Name">
                        </div>
                        <div class="col-md-2">
                        	<label class="form-label">Domain Name</label>
                            <select class="form-select" id="domain">
							</select>
                        </div>
                       
                        <div class=" col-md-2 ">
                        	<label class="form-label">Start Timing</label>
    						<input type="time" class="form-control me-1" id="startTime">
    						
						</div>
                        <div class="col-md-2">
                            <label class="form-label">End Timing</label>
    						<input type="time" class="form-control" id="endTime">
                        </div>
                        <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status" placeholder="Status">
    						<option value="ONGOING">ONGOING</option>
    						<option value="COMPLETED">COMPLETED</option>
						</select>
						</div>
                        <div class="col-md-2">
                        	<label class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="startDate">
                        </div>
                        <div class="col-md-2">
                        	<label class="form-label">End Date</label>
                            <input type="date" class="form-control" id="endDate">
                        </div>
                        <div class="col-md-2">
                        	<label class="form-label">Trainer Id</label>
                            <select class="form-select" id="trainerId"></select>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button class="btn btn-success" onclick="createBatch()">Create Batch</button>
                    </div>

                </div>
            </div>
            
            <div id="dom" class="card shadow-sm mb-4">
            	<div class="card-header">📦 Add Domain</div>
            	<div class="card-body">
             		<div class="col-md-2">
                        <label class="form-label">Add Domain</label>
                        <input class="form-control" id="newDomain" placeholder="Add new domain">
						<button class="btn btn-success mt-2 w-100" onclick="addDomain()">Add</button>
              		</div>
              	</div>
            </div>
            
            <div class="d-flex mb-3">
    			<input type="text" id="searchDomain" class="form-control me-2" placeholder="Search by Domain...">
    			<button class="btn btn-primary" onclick="searchBatch()">Search</button>
			</div>

            <!-- BATCH TABLE -->
            <div id="batchList" class="card shadow-sm mb-4">
                <div class="card-header">📋 Batch List</div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Domain</th>
                                <th>Timing</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Status</th>
                                <th>Trainer</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="batchTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- HISTORY -->
            <div id="history" class="card shadow-sm">
                <div class="card-header">📜 Completed Batches</div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Domain</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="js/admin.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
