<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Batch</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="page-container">
    <div class="mb-4">
        <h3 class="section-title">Edit Batch</h3>
        <p class="section-subtitle">Update schedule, trainer, and status for this batch.</p>
    </div>

    <div class="card p-4">
        <div class="d-flex align-items-center mb-3">
            <i class="bi bi-calendar2-check fs-4 me-2"></i>
            <h5 class="mb-0">Batch Information</h5>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <label for="batchName" class="form-label">Batch Name</label>
                <input type="text" id="batchName" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="domain" class="form-label">Domain</label>
                <select id="domain" class="form-select"></select>
            </div>

            <div class="col-md-4">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select">
                    <option value="ONGOING">ONGOING</option>
                    <option value="COMPLETED">COMPLETED</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="startTime" class="form-label">Start Time</label>
                <input type="time" id="startTime" class="form-control">
            </div>

            <div class="col-md-3">
                <label for="endTime" class="form-label">End Time</label>
                <input type="time" id="endTime" class="form-control">
            </div>

            <div class="col-md-3">
                <label for="startDate" class="form-label">Start Date</label>
                <input type="date" id="startDate" class="form-control">
            </div>

            <div class="col-md-3">
                <label for="endDate" class="form-label">End Date</label>
                <input type="date" id="endDate" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="trainerId" class="form-label">Trainer</label>
                <select id="trainerId" class="form-select"></select>
            </div>
        </div>

        <div class="page-actions mt-4">
            <button class="btn btn-success" onclick="updateBatch()">Update</button>
            <a href="admin.html" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="/js/batch-edit.js"></script>

</body>
</html>
