<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit User</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>

<body>
<div class="page-container">
    <div class="mb-4">
        <h3 class="section-title">Edit User</h3>
        <p class="section-subtitle">Update user details from the admin panel.</p>
    </div>

    <div class="card p-4">
        <div class="d-flex align-items-center mb-3">
            <i class="bi bi-pencil-square fs-4 me-2"></i>
            <h5 class="mb-0">User Details</h5>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="Name">
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Email">
            </div>
            <div class="col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control" placeholder="Phone">
            </div>
            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Password">
            </div>
        </div>

        <div class="page-actions mt-4">
            <button class="btn btn-success" onclick="updateUser()">Update</button>
            <a href="admin.html" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/users.js"></script>
</body>
</html>
