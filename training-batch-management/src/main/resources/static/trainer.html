<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trainer Dashboard</title>

<!-- Bootstrap -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Calendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

<link href="css/style.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div id="sidebar" class="text-white p-3">
        <h4 class="mb-4">📊 Dashboard</h4>

        <ul class="nav flex-column">
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#main" >🏠 Home</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#batches">📦 Batches</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#noti">🔔 Notifications</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#prog">📊 Progress</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="#calender">📅 Calendar</a></li>
        </ul>
    </div>

    <!-- MAIN -->
    <div id="main" class="flex-grow-1 content">

        <!-- TOPBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm px-3">
            <span class="navbar-brand">Trainer Panel</span>
            <button class="btn btn-info me-2" onclick="goProfile()">Profile</button>
            <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
        </nav>

        <div class="container-fluid p-4">

            <!-- STATS -->
            <div class="row mb-4">

                <div class="col-md-4">
                    <div class="card shadow-sm p-3">
                        <h6>Total Batches</h6>
                        <h3 id="totalBatches">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm p-3">
                        <h6>Notifications</h6>
                        <h3 id="count">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm p-3">
                        <h6>Students</h6>
                        <h3 id="totalStudents">0</h3>
                    </div>
                </div>

            </div>

            <!-- CREATE BATCH -->
            <div id="newbatch" class="card shadow-sm mb-4">
                <div class="card-header">➕ Create Batch</div>
                <div class="card-body">

                    <div class="row">
                        <div class="col-md-3">
                        	<label class="form-label">Batch Name</label>
                            <input type="text" id="batchName" class="form-control" placeholder="Batch Name">
                        </div>
                        <div class="col-md-3">
                        	<label class="form-label">Domain Name</label>
    						<select class="form-select" id="domain">
							</select>
						</div>
						<div class="col-md-3">
							<label class="form-label">Start Time</label>
    						<input type="time" id="startTime" class="form-control me-1">
						</div>
						<div class="col-md-3">
							<label class="form-label">End Time</label>
    						<input type="time" id="endTime" class="form-control">
						</div>
                        <div class="col-md-3">
                        	<label class="form-label">Start Date</label>
                            <input type="date" id="startDate" class="form-control">
                        </div>
                        <div class="col-md-3">
                        	<label class="form-label">End Date</label>
                            <input type="date" id="endDate" class="form-control">
                        </div>
                        <div class="col-md-3">
                        	<label class="form-label"><p> </p> </label>
                            <button class="btn btn-primary w-100" onclick="createBatch()">Create</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- CHART -->
            <div id="prog" class="card shadow-sm mb-4">
                <div class="card-header">📊 Progress</div>
                <div class="card-body" style="position: relative; height:320px;">
    				<canvas id="progressChart"></canvas>
				</div>
            </div>

            <!-- CALENDAR -->
            <div id="calender" class="card shadow-sm mb-4">
                <div class="card-header">📅 Calendar</div>
                <div class="card-body">
                    <div id="calendar" style="min-height:500px;"></div>
                </div>
            </div>

            <!-- NOTIFICATIONS -->
            <div id="noti" class="card shadow-sm mb-4">
                <div class="card-header">🔔 Notifications</div>
                <ul id="notifications" class="list-group list-group-flush"></ul>
            </div>

            <!-- BATCH TABLE -->
            <div id="batches" class="card shadow-sm">
                <div class="card-header">📦 My Batches</div>
                <div class="card-body">
                
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Progress</th>
                                <th>Topics</th>
                                <th>Students</th>
                            </tr>
                        </thead>
                        <tbody id="batchTable"></tbody>
                    </table>
                </div>
                
            </div>
            

        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/trainer.js"></script>

</body>
</html>
