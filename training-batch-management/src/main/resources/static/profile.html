<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Profile</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>

<body>
<div class="page-container">
    <div class="mb-4">
        <h3 class="section-title">My Profile</h3>
        <p class="section-subtitle">Manage your personal information and account security.</p>
    </div>

    <div class="card p-4 mb-4">
        <div class="d-flex align-items-center mb-3">
            <i class="bi bi-person-circle fs-3 me-2"></i>
            <h5 class="mb-0">Profile Information</h5>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <label for="name" class="form-label">Name</label>
                <input id="name" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="email" class="form-label">Email</label>
                <input id="email" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="phone" class="form-label">Phone</label>
                <input id="phone" class="form-control">
            </div>
        </div>

        <div class="page-actions mt-4">
            <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
            <button class="btn btn-outline-secondary" onclick="goBack()">Back To Dashboard</button>
        </div>
    </div>

    <div class="card p-4">
        <div class="d-flex align-items-center mb-3">
            <i class="bi bi-shield-lock fs-4 me-2"></i>
            <h5 class="mb-0">Change Password</h5>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="oldPassword" class="form-label">Old Password</label>
                <input type="password" id="oldPassword" class="form-control" placeholder="Old Password">
            </div>
            <div class="col-md-6">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="New Password">
            </div>
        </div>

        <div class="page-actions mt-4">
            <button class="btn btn-warning" onclick="changePassword()">Change Password</button>
        </div>
    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
